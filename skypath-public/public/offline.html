<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkyPath Offline</title>
    <style>
      body { margin: 0; min-height: 100vh; font-family: system-ui, sans-serif; background: #eef2ff; color: #111827; display: flex; align-items: center; justify-content: center; }
      .container { max-width: 640px; padding: 32px; background: white; border-radius: 24px; box-shadow: 0 20px 60px rgba(15,23,42,0.12); }
      .hero { width: 100%; height: 240px; margin-bottom: 24px; }
      .hero svg { width: 100%; height: 100%; }
      a { color: #4f46e5; text-decoration: none; font-weight: 700; }
      .title { font-size: 2rem; margin-bottom: 12px; }
      .subtitle { color: #4b5563; line-height: 1.75; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="hero">
        <svg viewBox="0 0 600 360" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M0 280C120 180 240 320 360 220C480 120 600 240 600 240V360H0V280Z" fill="#eef2ff"/>
          <path d="M220 160C240 150 260 146 280 150L420 178C440 182 455 200 450 220L418 312C414 330 392 340 374 334L280 304L220 160Z" fill="#4f46e5"/>
          <path d="M220 160L132 180C116 184 106 200 108 216L134 314C136 334 156 348 176 342L220 160Z" fill="#c7d2fe"/>
          <path d="M277 255L320 268" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
          <circle cx="460" cy="80" r="40" fill="#fbbf24"/>
        </svg>
      </div>
      <h1 class="title">You're offline.</h1>
      <p class="subtitle">SkyPath still remembers your bookings and lets you reconnect when the network returns. Browse your cached reservations once you regain connectivity.</p>
      <p class="subtitle" style="margin-top:16px;">Go back to <a href="/bookings">My Bookings</a> for your saved itinerary.</p>
    </div>
  </body>
</html>
